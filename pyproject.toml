[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jit-ca-poc"
version = "0.1.0"
description = "DNS-triggered certificate prewarming and local TLS cloud-emulation proof of concept"
requires-python = ">=3.11"
dependencies = ["cryptography>=42,<48"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
jitca = "jitca.cli:main"

[tool.setuptools.packages.find]
include = ["jitca*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
