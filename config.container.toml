[network]
dns_host = "0.0.0.0"
dns_port = 15353
tls_host = "0.0.0.0"
tls_port = 18443
redirect_ipv4 = "127.0.0.1" # CHANGE to host's LAN address before enrolling an IoT VLAN
allowed_clients = ["0.0.0.0/0"] # Container-bridge sources are NATed. Host publishes LOOPBACK ONLY. Restrict for LAN deployment.
[certificates]
mode = "local"
state_dir = "/state"
leaf_days = 30
leaf_key = "rsa2048"
[http]
max_body_bytes = 65536
[[endpoints]]
hostname = "robot.example.test"
[[endpoints.routes]]
method = "GET"
path = "/status"
body = '{"robot":{"connected":true,"mode":"idle"},"source":"jitca"}'
