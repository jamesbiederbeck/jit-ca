# Only explicitly configured hostnames receive answers/certificates.
# Bind to loopback by default. Do not expose directly to the internet.
[network]
dns_host = "127.0.0.1"
dns_port = 15353
tls_host = "127.0.0.1"
tls_port = 18443
# DNS A answers default to the service's TLS bind/interface address.
# Override for NAT, containers, or a different externally reachable gateway:
# redirect_ipv4 = "192.0.2.10"
allowed_clients = ["127.0.0.1/32", "::1/128"]
# Answer EVERY A query with redirect_ipv4 instead of REFUSED for unknown names
# (needs redirect_ipv4; never issues certificates for non-endpoint names):
# dns_answer_all = true

[certificates]
mode = "local"                  # use a locally generated DEMO CA
state_dir = "./state"
leaf_days = 30
leaf_key = "rsa2048"             # or p256

# Optional experimental external issuer with your own CA material:
# mode = "external"
# issuer_cert = "issuer/issuer.crt"
# issuer_key = "issuer/issuer.key"
# chain_files = ["issuer/parent.crt"]
# WARNING: does not bypass pinning, mTLS, revocation or expiry.

# Optional experimental directory issuer: a flat directory of operator-supplied
# CA cert/key pairs (no manifest), one profile picked per endpoint:
# mode = "directory"
# ca_dir = "issuer/cas"
# default_issuer = "OV TLS"      # substring matched against each CA's subject DN
# Per-endpoint override: add `issuer = "EV TLS"` (or similar) to that
# [[endpoints]] table below. The selector must match exactly one CA's subject.

[http]
max_body_bytes = 65536
backend_timeout_seconds = 5
max_response_bytes = 1048576

[[endpoints]]
hostname = "robot.example.test"
# With no routes, every request is logged, answered with empty 204, and closed.
# These optional fixtures demonstrate how to start building a local API.

[[endpoints.routes]]
method = "GET"
path = "/status"
status = 200
content_type = "application/json"
body = '{"robot":{"connected":true,"mode":"idle"},"source":"jitca"}'

[[endpoints.routes]]
method = "POST"
path = "/commands"
status = 202
content_type = "application/json"
body = '{"accepted":true,"source":"jitca"}'

# Optional backend directive, scoped to this hostname and a path prefix.
# The backend can be your own Python app, nginx, Apache, or another emulator.
# [[endpoints.routes]]
# path_prefix = "/api/"
# proxy_pass = "http://127.0.0.1:9000"
# headers = { X-Emulator = "local" }

# Optional default-allow: any hostname not listed above that a client reaches over TLS
# gets an on-demand leaf certificate and is served by these routes (none => 204) and
# logged with default_endpoint = true. max_hostnames bounds how many distinct names are
# signed per run. In directory issuer mode this needs certificates.default_issuer.
# Review what was seen with `jitca observed`; `jitca observed --toml` prints
# [[endpoints]] stanzas to promote observed names.
# [default_endpoint]
# max_hostnames = 100
# [[default_endpoint.routes]]
# path_prefix = "/"
# body = '{"observed":true}'

# Optional raw body capture: writes every non-empty request/response body, UNREDACTED, to
# <state_dir>/captures/ (0600). events.jsonl stays redacted and only names the capture file.
# redact = true stores key-name-redacted JSON instead and skips non-JSON bodies.
# [capture]
# enabled = true
# max_body_bytes = 262144
# max_files = 1000
# redact = false

# Optional: also print every event (the same JSON line as events.jsonl) to stdout.
# [logging]
# stdout = true
